name: OPA Lint & Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  opa:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Show OPA Version
        run: opa version
      - name: Install Regal
        run: |
          curl -L -o regal https://github.com/StyraInc/regal/releases/latest/download/regal_Linux_x86_64
          chmod +x regal
          sudo mv regal /usr/local/bin/regal

      - name: Fetch Input Schema
        run: |
          curl -sSf -o openapi.json 'https://api.cloudsmith.io/v2/openapi/?format=json'
          jq '. as $r | $r.components.schemas.PolicyInput + {components: $r.components}' \
            openapi.json > policy_input.json

      - name: Lint with Regal
        run: regal lint --fail-level warning recipes tests
      - name: Format Check
        run: |
          if [ -d recipes ]; then
            opa fmt --fail recipes
          else
            echo "No recipes folder"
          fi
          if [ -d tests ]; then
            opa fmt --fail tests
          else
            echo "No tests folder"
          fi

      - name: Validate Policies
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            opa check --strict --schema policy_input.json "$file" || failed=1
          done < <(find recipes tests templates -name "*.rego" -print0)
          exit $failed

      - name: Unit Test Policies
        run: |
          failed=0
          while IFS= read -r -d '' test_file; do
            policy="recipes/${test_file#tests/}"
            policy="${policy/_test/}"
            echo "Testing $policy with $test_file"
            opa test "$policy" "$test_file" || failed=1
          done < <(find tests -name "*_test.rego" -print0)
          exit $failed
